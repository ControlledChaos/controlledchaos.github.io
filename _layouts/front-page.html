<!doctype html>
<html xmlns:og="http://opengraphprotocol.org/schema/" class="no-js" lang="en_US" dir="ltr">

{%- include head.html -%}

<body class="front-page">

{%- include site-header.html -%}

<div id="front-page-sections" class="page-container front-page-sections" itemscope="itemscope" itemtype="WebPage">
	{{ content }}
</div>

{%- include visitor-notice.html -%}

<div class="page-loading">
	<div class="loading-icon">{%- include svg/site-icon.svg -%}</div>
	<p class="loading-text">{{ site.loading_text | default: "Loading" }}</p>
</div>

<!-- General theme scripts. -->
<script src="{{ '/assets/js/lightbox.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/tooltips.min.js' | relative_url }}"></script>

<!-- Scripts specific to the front page. -->
<script src="{{ '/assets/js/slider.min.js' | relative_url }}"></script>
<script>

// Various jQuery scripts on document ready.
jQuery(document).ready( function($) {

	// Custom Tooltipster tooltips for `title` attribute content.
	$( 'a[data-tooltip], button[data-tooltip]' ).tooltipster({
		distance: 5,
		delay: 150,
		theme: 'ccdzen'
	});

	// Smooth scroll to content
	$( 'a[href^="#"]' ).click( function(e) {

		e.preventDefault();

		var anchor = $(this).attr( 'href' );
		$( 'html, body' ).animate( { scrollTop : $( anchor ).offset().top }, 500 );
	});
});

$(window).on( 'pageshow', function() {

	// Remove loading panel after assets/images are loaded.
	$( '.page-loading' ).fadeOut( 250 );

	// Start Slick slideshow.
	$( '#intro-slides' ).slick({
		slidesToShow    : 1,
		slidesToScroll  : 1,
		autoplay        : true,
		autoplaySpeed   : 5500,
		speed           : 750,
		fade            : true,
		easing          : 'easeInOut',
		adaptiveHeight  : false,
		pauseOnHover    : false,
		dots            : false,
		arrows          : true,
		prevArrow: '<button class="slick-prev" aria-label="Previous" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512"><path fill="currentColor" d="M15.5 239c-9.4 9.4-9.4 24.6 0 33.9l160 160c9.4 9.4 24.6 9.4 33.9 0s9.4-24.6 0-33.9l-143-143 143-143c9.4-9.4 9.4-24.6 0-33.9s-24.6-9.4-33.9 0L15.5 239z"/></svg><span class="screen-reader-text"> Previous</span></button>',
		nextArrow: '<button class="slick-next" aria-label="Next" type="button"><span class="screen-reader-text">Next </span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512"><path fill="currentColor" d="M241.5 239c9.4 9.4 9.4 24.6 0 33.9L81.5 433c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l143-143-143-143c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l160 160z"/></svg></button>'
	});
});
</script>

<!-- Simple Analytics -->
<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

</body>
</html>
