<!doctype html>
<html xmlns:og="http://opengraphprotocol.org/schema/" class="no-js" lang="en_US" dir="ltr">

{%- include head.html -%}

<body class="front-page">

	{%- include site-header.html -%}

	<div id="front-page-sections" class="page-container front-page-sections" itemscope="itemscope" itemtype="WebPage">
		{{ content }}
	</div>
	<div class="page-loading">
		<div class="loading-icon"></div>
		<p class="loading-text">{{ site.loading_text | default: "Loading" }}</p>
	</div>

{%- assign js_ver = 'now' | date: "%Y-%m-%d-%H-%M" | prepend: "?v=" -%}

<!-- General theme scripts. -->
<script src="{{ '/assets/js/lightbox.min.js' | append: js_ver | relative_url }}"></script>
<script src="{{ '/assets/js/tooltips.min.js' | append: js_ver | relative_url }}"></script>

<!-- Scripts specific to the front page. -->
<script src="{{ '/assets/js/slider.min.js' | append: js_ver | relative_url }}"></script>
<script src="{{ '/assets/js/fullpage.min.js' | append: js_ver | relative_url }}"></script>
<script src="{{ '/assets/js/fullpage.extensions.min.js' | append: js_ver | relative_url }}"></script>
<script>

// Various jQuery scripts on document ready.
jQuery(document).ready( function($) {

	// FullPage navigation & presentation of sections.
	$( '#front-page-sections' ).fullpage({
		anchors     : [ 'slides', 'intro', 'projects', 'posts', 'footer' ],
		lockAnchors : true,
		navigation  : false,
		showActiveTooltip  : false,
		navigationTooltips : [ 'Slideshow', 'Introduction', 'Featured Projects', 'Latest Posts', 'More Info' ],
		dragAndMove     : true,
		sectionSelector : '.front-page-section',
		paddingTop      : 0,
		paddingBottom   : 0,
		scrollOverflow      : true,
		scrollOverflowReset : true,
		afterLoad : function() {

			// Add class to the body element.
			var body = document.querySelector( 'body' );
				body.classList.add( 'custom-scroll' );

			// Remove "made with" credit.
			$( '.fp-watermark' ).remove();
		},
		afterRender : function() {

			// Start Slick slideshow.
			$( '#intro-slides' ).slick({
				slidesToShow   : 1,
				slidesToScroll : 1,
				autoplay       : true,
				autoplaySpeed  : 4000,
				speed          : 750,
				fade           : true,
				easing         : 'easeInOut',
				adaptiveHeight : false,
				pauseOnHover   : false,
				arrows         : false,
				dots           : false
			});

			// Remove loading panel.
			$( '.page-loading' ).delay( 150 ).fadeOut( 250 );
		},
		onLeave : function( origin, destination, direction ) {

			// Conditional header classes.
			if ( origin.index == 0 && direction =='down' ) {
				$( '.site-header' ).addClass( 'header-scrolled' );
			}
			if ( destination.index == 0 ) {
				$( '.site-header' ).removeClass( 'header-scrolled' );
			}
			if ( destination.index == 4 ) {
				$( '.site-header' ).addClass( 'header-alt-01' );
			}
			if ( origin.index == 4 && direction =='up' ) {
				$( '.site-header' ).removeClass( 'header-alt-01' );
			}
		}
	});

	// FullPage section navigation buttons.
	$( '.scroll-down' ).click( function() {
		fullpage_api.moveSectionDown();
	});
	$( '.scroll-up' ).click( function() {
		fullpage_api.moveSectionUp();
	});

	// Custom Tooltipster tooltips for `title` attribute content.
	$( 'a[data-tooltip]', 'button[data-tooltip]' ).tooltipster({
		distance: 5,
		theme: 'ccdzen'
	});
});
</script>

<!-- Simple Analytics -->
<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

</body>
</html>
