---
layout: front-page
---

{%- assign sections = site.front-page | sort: "order" -%}

{%- for section in sections -%}
	{%- assign slug = section.path | replace: "_front-page/", "front-sections/" | remove: section.ext -%}
	{{ section }}
	{%- include {{ slug }}.html section = section -%}
{%- endfor -%}
