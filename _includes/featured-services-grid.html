{%- assign page = include.page -%}
{%- assign tabs = page.tabs -%}

<div class="content-loop-grid featured-services-grid">

	{% for tab in tabs | limit: 3 %}
	<article class="featured-post">
		<a href="{{ page.permalink | append: '#' | append: tab.section }}">
			<figure>
				<img src="{{ 'assets/img/' | append: tab.cover | absolute_url }}" loading="lazy" />
				<figcaption>
					<h3>{{ tab.tab }}</h3>
					<p>{{ tab.subtitle }}</p>
				</figcaption>
			</figure>
		</a>
	</article>
	{% endfor %}

</div>
