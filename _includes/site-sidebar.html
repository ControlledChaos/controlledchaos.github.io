{%- if site.modules-aside -%}
{%- assign sections = site.modules-aside | sort: "order" -%}

<aside class="page-sidebar">
	{%- for module in modules -%}

	{%- assign slug = module.path | remove: "_modules-aside/" | remove: module.ext -%}

	{% include sidebar/{{ slug }}.html module = module %}

	{%- endfor -%}
</aside>
{%- endif -%}
